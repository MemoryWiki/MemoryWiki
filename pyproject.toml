[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memorywiki"
version = "0.1.1"
description = "Local-first Memory Wiki for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "MemoryWiki Maintainers", email = "maintainers@memorywiki.dev"}]
keywords = ["agent-memory", "local-first", "mcp", "knowledge-management"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "defusedxml>=0.7.1,<1.0.0",
  "pydantic>=2.0.0,<3.0.0",
  "tzdata>=2024.1,<2027.0 ; platform_system=='Windows'",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0,<2.0.0",
  "pre-commit>=3.5.0,<5.0.0",
  "pytest>=9.0.3,<10.0.0",
  "pytest-cov>=5.0.0,<7.0.0",
  "ruff>=0.4.0,<1.0.0",
  "bandit>=1.7.8,<2.0.0",
  "pip-audit>=2.7.0,<3.0.0",
]
mcp = [
  "mcp[cli]>=1.27.1,<2.0.0 ; python_version >= '3.10'",
]
openai = [
  "openai>=2.32.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/MemoryWiki/MemoryWiki"
Documentation = "https://github.com/MemoryWiki/MemoryWiki/tree/main/docs"
Repository = "https://github.com/MemoryWiki/MemoryWiki"
Changelog = "https://github.com/MemoryWiki/MemoryWiki/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/MemoryWiki/MemoryWiki/issues"

[project.scripts]
memorywiki-agents-review-prompt = "agents_review_prompt:main"
memorywiki-backup = "memory_backup:main"
memorywiki-construction-report = "memorywiki_construction_report:main"
memorywiki-context = "memorywiki_context:main"
memorywiki-crystallize = "memory_crystallize:main"
memorywiki-crystallize-candidates = "memory_crystallize_candidates:main"
memorywiki-config = "memorywiki_config:main"
memorywiki-capture-ingest = "memory_capture_ingest:main"
memorywiki-cross-project-install = "memorywiki_cross_project_install:main"
memorywiki-export = "memorywiki_export:main"
memorywiki-feedback = "memory_feedback:main"
memorywiki-forget = "memory_forget:main"
memorywiki-file-history = "memorywiki_file_history:main"
memorywiki-golden-eval = "retrieval_golden_eval:main"
memorywiki-health = "memory_health:main"
memorywiki-index-build = "memory_index_build:main"
memorywiki-index-maintain = "memory_index_maintain:main"
memorywiki-ingest-source = "source_ingest:main"
memorywiki-knowledge-ops = "memorywiki_knowledge_ops:main"
memorywiki-lifecycle = "memory_lifecycle:main"
memorywiki-list = "memorywiki_list:main"
memorywiki-mcp = "memorywiki_mcp.cli:main"
memorywiki-mcp-contract = "memorywiki_mcp_contract:main"
memorywiki-mcp-doctor = "memorywiki_mcp_doctor:main"
memorywiki-mcp-config = "memorywiki_mcp.client_config:main"
memorywiki-mcp-smoke = "memorywiki_mcp.smoke_client:main"
memorywiki-merge-episodes = "merge_episodes:main"
memorywiki-ops-dashboard = "memorywiki_ops_dashboard:main"
memorywiki-project-agents = "project_agents:main"
memorywiki-project-matrix = "memorywiki_project_matrix:main"
memorywiki-project-profile = "project_profile:main"
memorywiki-quality-report = "memorywiki_quality_report:main"
memorywiki-recall = "memory_recall:main"
memorywiki-release-check = "memorywiki_release_check:main"
memorywiki-release-manifest = "memorywiki_release_manifest:main"
memorywiki-restore-check = "memorywiki_restore_check:main"
memorywiki-review = "memory_review:main"
memorywiki-session-summary = "session_summary:main"
memorywiki-status = "memorywiki_status:main"
memorywiki-timeline = "memory_timeline:main"
memorywiki-wake-prompt = "generate_wake_prompt:main"
mw = "mw_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "unit: fast logic tests with minimal filesystem use",
  "integration: tests that exercise CLI, subprocesses, MCP, or filesystem lifecycles",
  "slow: tests that may take more than one second",
  "smoke: end-to-end smoke tests for release or MCP surfaces",
]

[tool.coverage.run]
branch = false
source = ["memory_system", "memorywiki_mcp"]
omit = [
  "*/pytest-*/*",
  "*/memorywiki-restore-*/*",
]

[tool.coverage.report]
fail_under = 80
skip_empty = true
show_missing = true

[tool.setuptools]
include-package-data = true
py-modules = [
  "agent_leases",
  "agents_review_prompt",
  "demo_chat",
  "generate_wake_prompt",
  "memory_backup",
  "memory_capture_ingest",
  "memory_construction",
  "memory_crystallize",
  "memory_crystallize_candidates",
  "memorywiki_config",
  "memorywiki_construction_report",
  "memorywiki_context",
  "memory_feedback",
  "memory_forget",
  "memory_health",
  "memory_index_build",
  "memory_index_maintain",
  "memory_lifecycle",
  "memorywiki_list",
  "memory_recall",
  "memory_review",
  "memory_timeline",
  "memorywiki_cross_project_install",
  "memorywiki_export",
  "memorywiki_file_history",
  "memorywiki_knowledge_ops",
  "memorywiki_mcp_contract",
  "memorywiki_mcp_doctor",
  "memorywiki_operator_env",
  "memorywiki_ops_dashboard",
  "memorywiki_project_matrix",
  "memorywiki_quality_report",
  "memorywiki_release_check",
  "memorywiki_release_manifest",
  "memorywiki_restore_check",
  "memorywiki_status",
  "merge_episodes",
  "mw_cli",
  "project_agents",
  "project_profile",
  "retrieval_golden_eval",
  "session_summary",
  "source_ingest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["memory_system*", "memorywiki_mcp*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "B", "I", "UP031", "UP032"]
ignore = ["B904", "E501"]

[tool.ruff.lint.per-file-ignores]
"memorywiki_mcp/tools.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
