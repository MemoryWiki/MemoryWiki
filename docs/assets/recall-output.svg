  <text x="52" y="276" font-family="Menlo, Consolas, monospace" font-size="17" fill="#e6edf3">1. [project/semantic] MemoryWiki Overview</text>
  <text x="52" y="310" font-family="Menlo, Consolas, monospace" font-size="17" fill="#cbd5e1">MemoryWiki is a local-first memory wiki for AI agents.</text>
