name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: lint and type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev,mcp]"
      - name: Ruff lint
        run: python -m ruff check .
      - name: MyPy type check
        run: >
          python -m mypy
          memory_system
          memorywiki_mcp
          --follow-imports=silent

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev,mcp]"
      - name: Run tests
        run: python -m pytest tests -q
      - name: Coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m coverage erase
          python -m pytest tests \
            --cov=memory_system \
            --cov=memorywiki_mcp \
            --cov-report=term-missing

  security:
    name: security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev,mcp]"
      - name: Bandit
        run: >
          python -m bandit
          --severity-level high
          --confidence-level high
          -q
          -r memory_system memorywiki_mcp
          -x tests
      - name: Pip audit
        run: python -m pip_audit . --progress-spinner off

  release-smoke:
    name: release smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev,mcp]"
      - name: Public clean gate
        run: python -m pytest tests/test_public_clean.py -q
      - name: Golden retrieval eval
        run: >
          memorywiki-golden-eval
          --project-root examples/memory-root
          --global-root examples/memory-root
          --case-file docs/memorywiki-golden-cases.json
          --format json
      - name: Mini recall benchmark
        run: python benchmarks/mini_recall_benchmark.py --format json
      - name: Create release smoke backup
        run: |
          mkdir -p "$RUNNER_TEMP/memorywiki-release/backups"
          memorywiki-backup \
            --root "." \
            --backup-root "$RUNNER_TEMP/memorywiki-release/backups" \
            --name memorywiki-core \
            --message "release smoke backup" \
            --format json
      - name: Release checker
        run: >
          memorywiki-release-check
          --repo-root .
          --project-root examples/memory-root
          --global-root examples/memory-root
          --config examples/mcp/.mcp.example.json
          --mcp-contract docs/memorywiki-mcp-v1-contract.json
          --golden-case-registry docs/memorywiki-golden-cases.json
          --backup-root "$RUNNER_TEMP/memorywiki-release/backups"
          --backup-name memorywiki-core
          --manifest-out "$RUNNER_TEMP/memorywiki-release/memorywiki-release-manifest.json"
          --format json

  package-artifacts:
    name: package artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned build tooling
        run: python -m pip install build==1.4.4 twine==6.2.0
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Scan built artifacts for private material
        run: |
          python - <<'PY'
          import pathlib
          import re
          import runpy
          import tarfile
          import zipfile

          ns = runpy.run_path("tests/test_public_clean.py")
          forbidden_markers = [marker.encode("utf-8") for marker in ns["FORBIDDEN_MARKERS"]]
          secret_patterns = ns["SECRET_PATTERNS"]
          offenders = []

          def scan_member(artifact, name, data):
              parts = pathlib.PurePosixPath(name).parts
              if name.startswith("/") or ".." in parts:
                  offenders.append(f"{artifact}:{name} has unsafe archive path")
                  return
              if name.endswith("tests/test_public_clean.py"):
                  return
              for marker in forbidden_markers:
                  if marker in data:
                      offenders.append(f"{artifact}:{name} contains forbidden marker")
              for pattern in secret_patterns:
                  if pattern.search(data):
                      offenders.append(f"{artifact}:{name} contains secret-like material")

          for artifact in pathlib.Path("dist").iterdir():
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      for name in archive.namelist():
                          if name.endswith("/"):
                              continue
                          scan_member(artifact, name, archive.read(name))
              elif artifact.name.endswith(".tar.gz"):
                  with tarfile.open(artifact, "r:gz") as archive:
                      for member in archive.getmembers():
                          if not member.isfile():
                              continue
                          handle = archive.extractfile(member)
                          if handle is not None:
                              scan_member(artifact, member.name, handle.read())
              else:
                  offenders.append(f"{artifact} has unexpected artifact extension")

          if offenders:
              raise SystemExit("\n".join(offenders))
          print("Built artifact scan passed.")
          PY
