name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev,mcp]"
      - name: Run tests
        run: python -m pytest tests -q

  release-smoke:
    name: release smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev,mcp]"
      - name: Public clean gate
        run: python -m pytest tests/test_public_clean.py -q
      - name: Golden retrieval eval
        run: >
          memorywiki-golden-eval
          --project-root examples/memory-root
          --global-root examples/memory-root
          --case-file docs/memorywiki-golden-cases.json
          --format json
      - name: Mini recall benchmark
        run: python benchmarks/mini_recall_benchmark.py --format json
      - name: Create release smoke backup
        run: |
          mkdir -p "$RUNNER_TEMP/memorywiki-release/backups"
          memorywiki-backup \
            --root "." \
            --backup-root "$RUNNER_TEMP/memorywiki-release/backups" \
            --name memorywiki-core \
            --message "release smoke backup" \
            --format json
      - name: Release checker
        run: >
          memorywiki-release-check
          --repo-root .
          --project-root examples/memory-root
          --global-root examples/memory-root
          --config examples/mcp/.mcp.example.json
          --mcp-contract docs/memorywiki-mcp-v1-contract.json
          --golden-case-registry docs/memorywiki-golden-cases.json
          --backup-root "$RUNNER_TEMP/memorywiki-release/backups"
          --backup-name memorywiki-core
          --manifest-out "$RUNNER_TEMP/memorywiki-release/memorywiki-release-manifest.json"
          --format json
