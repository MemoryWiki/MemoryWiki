name: Feature request
description: Suggest an improvement or integration.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should MemoryWiki do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - MCP
        - Retrieval
        - Memory layout
        - Documentation
        - Packaging
        - Other
  - type: textarea
    id: tradeoffs
    attributes:
      label: Tradeoffs
      description: What could become more complex or risky?
