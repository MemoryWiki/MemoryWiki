name: Install or MCP setup help
description: Report install, quickstart, or MCP client setup friction.
title: "[Install/MCP]: "
labels:
  - install
  - mcp
  - needs repro
body:
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
      description: Include the exact quickstart, MCP client, or docs page you followed.
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands and output
      description: Paste redacted commands and output. Do not include secrets or private paths.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Install method
      options:
        - git clone + pip install -e
        - pip install from package index
        - MCP client config
        - other
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, shell, and MCP client if relevant.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
